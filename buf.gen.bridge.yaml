# Go types and Connect handlers for the bridge's own API.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Sanoma-AI/provider-bridge/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
inputs:
  - directory: proto
    paths:
      - proto/bridge

# Go stubs for OpenTofu's plugin protocol (client side only is used).
# go_package is set here, not in the verbatim .proto files.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Sanoma-AI/provider-bridge/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen
    opt: paths=source_relative
inputs:
  - directory: proto
    paths:
      - proto/tfplugin5
      - proto/tfplugin6

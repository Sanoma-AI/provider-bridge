syntax = "proto3";

package sanoma.providerbridge.v1;

// BridgeService exposes OpenTofu providers to the Sanoma engine.
//
// Values cross this API as JSON text in `string` fields, not as
// google.protobuf.Struct, so that numbers keep full precision and a null
// attribute stays distinct from an absent one. Every JSON object follows the
// provider's schema as returned by GetSchema: nested blocks and nested
// attributes become arrays (list, set), objects (single, group) or records
// (map); dynamic attributes are encoded as {"value": ..., "type": ...}.
//
// Error diagnostics from the provider become a Connect error whose details
// carry one Diagnostic per diagnostic; warnings are returned in the response.
// Apply is the exception: its errors are in the response, see ApplyResponse.
service BridgeService {
  // GetSchema downloads (once, verified) and starts the provider, returns its
  // normalized schema document and stops it again. It needs no credentials.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  // Configure starts a long-lived provider instance and configures it.
  // Idempotent for the same config; a different config for the same
  // (source, version) fails with FAILED_PRECONDITION until Close.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // Import runs ImportResourceState and then ReadResource on each result.
  rpc Import(ImportRequest) returns (ImportResponse);
  // Read refreshes one resource from the vendor, upgrading its state first
  // when the request names the schema version it was written with. `gone`
  // means it no longer exists.
  rpc Read(ReadRequest) returns (ReadResponse);
  // Plan computes the change that makes one resource match config, as
  // OpenTofu's plan does: ValidateResourceConfig, the proposed new state
  // (config over prior), then PlanResourceChange. It does not refresh:
  // Read first. A destroy plan is not sent to the provider.
  rpc Plan(PlanRequest) returns (PlanResponse);
  // Apply carries out a plan with ApplyResourceChange. Provider errors are
  // returned in the response, beside whatever state the provider returned,
  // so an object created before the error is not lost.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Close stops one configured provider, or all of them.
  rpc Close(CloseRequest) returns (CloseResponse);
}

// ProviderRef names a provider release on the OpenTofu registry.
message ProviderRef {
  // Registry source address: "namespace/type" or "host/namespace/type",
  // e.g. "integrations/github".
  string source = 1;
  // Exact version, e.g. "6.13.0". Ranges are not accepted: providers are
  // never upgraded implicitly.
  string version = 2;
  // Hex sha256 of the release's SHA256SUMS document. When set, the bridge
  // refuses a release whose SHA256SUMS differs. Always echoed in responses.
  string sha256 = 3;
}

message GetSchemaRequest {
  ProviderRef provider = 1;
}

message GetSchemaResponse {
  // The schema document (formatVersion 1), see README.
  string schema_json = 1;
  // Negotiated plugin protocol major version: 5 or 6.
  int32 protocol = 2;
  // Hex sha256 of the release's SHA256SUMS document.
  string sha256 = 3;
}

message ConfigureRequest {
  ProviderRef provider = 1;
  // Provider configuration as a JSON object; omitted attributes are null.
  string config_json = 2;
}

message ConfigureResponse {
  repeated Diagnostic warnings = 1;
  // Hex sha256 of the release's SHA256SUMS document.
  string sha256 = 2;
}

// Resource is one resource instance's state.
message Resource {
  string type_name = 1;
  // State as a JSON object of the resource type's implied type.
  string state_json = 2;
  // Provider-private data. Opaque: pass it back unchanged on the next Read.
  bytes private = 3;
  // The resource type's schema version that produced state_json.
  int64 schema_version = 4;
}

message ImportRequest {
  ProviderRef provider = 1;
  string type_name = 2;
  // Provider-specific import ID, e.g. "repo" or "repo:main".
  string id = 3;
}

message ImportResponse {
  repeated Resource resources = 1;
  repeated Diagnostic warnings = 2;
}

message ReadRequest {
  ProviderRef provider = 1;
  string type_name = 2;
  // Prior state as a JSON object: of the resource type's current implied
  // type, or, when schema_version is set, as written at that version.
  string state_json = 3;
  bytes private = 4;
  // The schema version state_json was written with (Resource.schema_version
  // of the response that produced it). When set, the provider upgrades the
  // state (UpgradeResourceState) before reading it, as OpenTofu does on
  // every refresh; when unset, state_json must already match the current
  // schema.
  optional int64 schema_version = 5;
}

message ReadResponse {
  // Unset when gone is true.
  Resource resource = 1;
  // The remote object no longer exists.
  bool gone = 2;
  repeated Diagnostic warnings = 3;
}

message PlanRequest {
  ProviderRef provider = 1;
  string type_name = 2;
  // Prior state as a JSON object, as Read or Apply returned it; empty to
  // plan a create.
  string prior_state_json = 3;
  // Resource.private of the prior state.
  bytes prior_private = 4;
  // Resource.schema_version of the prior state. When set, the provider
  // upgrades the prior state first (as Read does); when unset,
  // prior_state_json must already match the current schema.
  optional int64 prior_schema_version = 5;
  // Desired configuration as a JSON object of the resource type's implied
  // type; omitted attributes are null, computed-only attributes must be
  // null. Empty to plan a delete.
  string config_json = 6;
}

message PlanResponse {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // The resource already matches config: nothing to apply.
    ACTION_NONE = 1;
    ACTION_CREATE = 2;
    // Updated in place.
    ACTION_UPDATE = 3;
    // An attribute that cannot change in place changed (requires_replace):
    // the resource must be deleted and created again. planned is the plan
    // of the new object, as for a create: apply a replace as Apply(prior,
    // no config, no planned), then Apply(no prior, config, planned).
    ACTION_REPLACE = 4;
    ACTION_DELETE = 5;
  }
  Action action = 1;
  // The planned new state as a JSON object, unknown values as null (listed
  // in unknown_paths). Empty for DELETE.
  string planned_state_json = 2;
  // Attributes known only after apply, as paths in the provider's terms
  // ("id", "rules[0].name", `tags["env"]`); a set with an unknown element
  // is listed (and null) as a whole.
  repeated string unknown_paths = 3;
  // For UPDATE and REPLACE, the attributes whose change requires
  // replacement; the action is REPLACE exactly when this is not empty.
  repeated string requires_replace = 4;
  // The planned state as the provider returned it (a msgpack DynamicValue).
  // Opaque: pass it to Apply unchanged. Empty for DELETE.
  bytes planned = 5;
  // Provider-private planned data. Opaque: pass it to Apply unchanged.
  bytes planned_private = 6;
  repeated Diagnostic warnings = 7;
}

message ApplyRequest {
  ProviderRef provider = 1;
  string type_name = 2;
  // The prior state the plan was made from (PlanRequest's fields, unchanged);
  // empty for a create.
  string prior_state_json = 3;
  // Sent as the planned private data of a delete; ignored otherwise.
  bytes prior_private = 4;
  optional int64 prior_schema_version = 5;
  // The config the plan was made from; empty for a delete.
  string config_json = 6;
  // PlanResponse.planned; empty for a delete (and only then: an empty
  // planned with a config_json is refused).
  bytes planned = 7;
  // PlanResponse.planned_private.
  bytes planned_private = 8;
}

message ApplyResponse {
  // The new state. Set whenever the provider returned an object, even
  // alongside errors (a create that failed half way still has an id);
  // unset after a delete.
  Resource resource = 1;
  // Error diagnostics from the provider. Apply reports them here rather
  // than as a Connect error so that resource survives. A Connect error
  // means the request was refused before the provider was called, or the
  // provider process failed.
  repeated Diagnostic errors = 2;
  repeated Diagnostic warnings = 3;
}

message CloseRequest {
  // Unset closes every provider instance.
  ProviderRef provider = 1;
}

message CloseResponse {}

message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_ERROR = 1;
    SEVERITY_WARNING = 2;
  }
  Severity severity = 1;
  string summary = 2;
  string detail = 3;
  // Attribute path in the provider's terms, e.g. "settings.secret",
  // "rules[0].name" or `tags["env"]`. Empty when the diagnostic is not
  // about one attribute.
  string attribute_path = 4;
}
